version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: submarket_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: submarket_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: submarket_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: