version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: submarket_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: submarket_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: submarket_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    image: node:22-bookworm
    container_name: submarket_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  backend_node_modules: